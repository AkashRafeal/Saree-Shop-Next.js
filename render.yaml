services:
  - type: web
    name: nivicollections-app
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: nivicollections-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nivicollections-db
    databaseName: nivicollections_db
    user: nivicollections_user
    plan: free
    region: oregon
